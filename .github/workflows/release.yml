name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tag version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          test "$release_version" = "$project_version"
      - run: ./gradlew clean build
      - name: Create checksum
        working-directory: build/libs
        run: sha256sum metadq.jar > metadq.jar.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/libs/metadq.jar \
            build/libs/metadq.jar.sha256 \
            --verify-tag \
            --generate-notes \
            --title "metadq ${GITHUB_REF_NAME#v}" \
            "${release_args[@]}"
