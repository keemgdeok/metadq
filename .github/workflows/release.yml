name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tag version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          test "$release_version" = "$project_version"
      - run: ./gradlew clean build
      - name: Create checksum
        working-directory: build/libs
        run: sha256sum metadq.jar > metadq.jar.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            build/libs/metadq.jar
            build/libs/metadq.jar.sha256
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify release artifact
        working-directory: release-assets
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum -c metadq.jar.sha256
          else
            shasum -a 256 -c metadq.jar.sha256
          fi
          java -jar metadq.jar doctor --demo | tee demo-output.txt
          grep -F "GUARD      No content data files opened." demo-output.txt

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.1.0" ]]; then
            release_args+=(--notes "**Limited external validation:** This release passed CI, Linux and macOS artifact checks, checksum verification, and the local MinIO/REST end-to-end test, but it has not yet been validated by external Iceberg users.")
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/metadq.jar \
            release-assets/metadq.jar.sha256 \
            --verify-tag \
            --generate-notes \
            --title "metadq ${GITHUB_REF_NAME#v}" \
            "${release_args[@]}"
