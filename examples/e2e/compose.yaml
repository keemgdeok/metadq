services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 admin password; do sleep 1; done;
        mc mb --ignore-existing local/warehouse

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"

  bootstrap:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    depends_on:
      rest:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./bootstrap.sh:/e2e/bootstrap.sh:ro
      - ./bootstrap.sql:/e2e/bootstrap.sql:ro
    entrypoint: ["/bin/bash", "/e2e/bootstrap.sh"]

  doctor:
    image: metadq-e2e:local
    build:
      context: ../..
      dockerfile: examples/e2e/Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./catalog.properties:/e2e/catalog.properties:ro
    command:
      - doctor
      - --catalog-properties
      - /e2e/catalog.properties
      - --table
      - analytics.events

  check:
    image: metadq-e2e:local
    build:
      context: ../..
      dockerfile: examples/e2e/Dockerfile
    depends_on:
      doctor:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./catalog.properties:/e2e/catalog.properties:ro
      - ./metadq.yml:/e2e/metadq.yml:ro
    command:
      - check
      - --catalog-properties
      - /e2e/catalog.properties
      - --table
      - analytics.events
      - --rules
      - /e2e/metadq.yml
